<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shared Profile — TechTalent Portal</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<style>
:root{--blue:#0b2e59;--accent:#1565c0;--green:#1b8a4a;--light:#e8f0fe;--text:#1a1a1a;--muted:#555;--border:#c5d5e8;--bg:#f3f6fb;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;}
.bar{background:var(--blue);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.bar a{color:#fff;text-decoration:none;font-weight:800;}
.bar span{font-size:.82rem;opacity:.85;}
.wrap{max-width:820px;margin:0 auto;padding:22px 16px 56px;}
.notice{background:#fff;border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:10px;padding:10px 14px;font-size:.86rem;color:var(--muted);margin-bottom:16px;}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:16px;}
.cover{height:90px;background:linear-gradient(120deg,#0b2e59,#1565c0 60%,#42a5f5);}
.head{padding:0 24px 22px;}
.avatar{width:104px;height:104px;border-radius:50%;border:4px solid #fff;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:800;margin-top:-52px;}
h1{font-size:1.6rem;color:var(--blue);margin-top:10px;line-height:1.25;}
.role{font-size:1.02rem;margin-top:2px;}
.where{color:var(--muted);font-size:.9rem;margin-top:4px;}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.badge{font-size:.78rem;font-weight:700;border-radius:12px;padding:3px 10px;background:var(--light);color:var(--blue);}
.badge.ok{background:#e6f4ea;color:var(--green);}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:9px 18px;border-radius:8px;font-weight:700;font-size:.92rem;text-decoration:none;border:1px solid var(--border);background:#fff;color:var(--blue);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
section.card{padding:20px 24px;}
h2{font-size:1.05rem;color:var(--blue);margin-bottom:10px;}
.summary{white-space:pre-line;color:#333;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{background:var(--light);color:var(--blue);border-radius:16px;padding:4px 12px;font-size:.85rem;font-weight:600;}
dl{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;font-size:.92rem;}
dt{color:var(--muted);} dd{font-weight:600;}
@media(max-width:520px){dl{grid-template-columns:1fr;} dt{margin-top:6px;} .head,section.card{padding-left:18px;padding-right:18px;}}
.state{background:#fff;border:1px solid var(--border);border-radius:14px;padding:40px 24px;text-align:center;}
.state h1{margin:8px 0 6px;font-size:1.3rem;}
.state p{color:var(--muted);}
[hidden]{display:none !important;}
.foot{text-align:center;color:var(--muted);font-size:.8rem;margin-top:22px;}
.foot a{color:var(--accent);}
#profile{-webkit-user-select:none;user-select:none;}
@media print{.bar,.acts,.foot{display:none!important;} body{background:#fff;}}
</style>
</head>
<body>
<header class="bar"><a href="index.html">TechTalent Portal</a><span>🔒 Private profile link</span></header>
<main class="wrap" id="main-content">
  <div id="loading" class="state"><p>Opening shared profile…</p></div>

  <div id="gone" class="state" hidden>
    <div style="font-size:2rem">🔗</div>
    <h1>This link isn't available</h1>
    <p id="goneText">It has expired or been turned off by the candidate. Ask them for a new link.</p>
    <div class="acts" style="justify-content:center"><a class="btn primary" href="index.html">Browse talent</a></div>
  </div>

  <div id="profile" hidden>
    <div class="notice" id="shareNote"></div>
    <div class="card">
      <div class="cover"></div>
      <div class="head">
        <div class="avatar" id="pAvatar"></div>
        <h1 id="pName"></h1>
        <div class="role" id="pRole"></div>
        <div class="where" id="pWhere"></div>
        <div class="badges" id="pBadges"></div>
        <div class="acts" id="pActs"></div>
      </div>
    </div>
    <section class="card" id="secAbout" hidden><h2>About</h2><p class="summary" id="pSummary"></p></section>
    <section class="card" id="secSkills" hidden><h2>Skills</h2><div class="chips" id="pSkills"></div></section>
    <section class="card"><h2>Details</h2><dl id="pDetails"></dl></section>
  </div>

  <p class="foot">Shared privately through <a href="index.html">TechTalent Portal</a>. Please don't forward this link.</p>
</main>
<script>
const API = 'https://techtalent-accounts.purna-padishala.workers.dev';
const $ = id => document.getElementById(id);
const when = d => new Date(d).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
function gone(text) { $('loading').hidden = true; $('gone').hidden = false; if (text) $('goneText').textContent = text; }
function add(parent, tag, cls, text) { const el = document.createElement(tag); if (cls) el.className = cls; if (text != null) el.textContent = text; parent.appendChild(el); return el; }
(async function () {
  // The token lives in the # part of the address, which browsers never send to servers or other sites
  const t = (location.hash.match(/[#&]t=([a-f0-9]{40})\b/) || [])[1];
  if (!t) return gone('This link is incomplete. Copy the whole link from the message you received.');
  let r, d;
  try { r = await fetch(`${API}/shared/${t}`, { signal: AbortSignal.timeout(15000) }); d = await r.json().catch(() => ({})); }
  catch { return gone("We couldn't load the profile. Check your connection and refresh the page."); }
  if (!r.ok || !d.profile) return gone(d && d.error);
  const p = d.profile;
  document.title = `${p.name} — Shared Profile — TechTalent Portal`;
  $('shareNote').textContent = `🔒 ${p.name.split(' ')[0]} shared this profile with you privately. The link works until ${when(d.expiresAt)}.`;
  $('pAvatar').textContent = p.initials || p.name.slice(0, 2).toUpperCase();
  $('pName').textContent = p.name;
  $('pRole').textContent = [p.role, p.company && 'at ' + p.company].filter(Boolean).join(' ');
  $('pWhere').textContent = [p.location && '📍 ' + p.location, p.exp && '💼 ' + p.exp].filter(Boolean).join('   ');
  const badges = $('pBadges');
  if (p.verified) add(badges, 'span', 'badge ok', '✓ Email verified');
  if (p.availability) add(badges, 'span', 'badge', '🟢 ' + p.availability);
  if (p.domain) add(badges, 'span', 'badge', p.domain);
  const acts = $('pActs');
  if (d.email) { const a = add(acts, 'a', 'btn primary', '✉ Email ' + p.name.split(' ')[0]); a.href = 'mailto:' + encodeURIComponent(d.email).replace('%40', '@') + '?subject=' + encodeURIComponent('Regarding your TechTalent profile'); }
  if (p.linkedin && /^https:\/\/([\w-]+\.)?linkedin\.com\//i.test(p.linkedin)) { const a = add(acts, 'a', 'btn', 'LinkedIn ↗'); a.href = p.linkedin; a.target = '_blank'; a.rel = 'noopener noreferrer'; }
  if (p.summary) { $('pSummary').textContent = p.summary; $('secAbout').hidden = false; }
  if (p.tech && p.tech.length) { p.tech.forEach(s => add($('pSkills'), 'span', 'chip', s)); $('secSkills').hidden = false; }
  const dl = $('pDetails');
  [['Current role', p.role], ['Company', p.company], ['Location', p.location], ['Experience', p.exp], ['Domain', p.domain], ['Availability', p.availability],
   ['Email', d.email || 'Not shared'], ['Profile updated', p.updatedAt && when(p.updatedAt)]]
    .filter(([, v]) => v).forEach(([k, v]) => { add(dl, 'dt', '', k); add(dl, 'dd', '', v); });
  $('loading').hidden = true; $('profile').hidden = false;
})();
</script>
</body>
</html>
