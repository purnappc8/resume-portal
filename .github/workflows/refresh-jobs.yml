# Refreshes feed/jobs.json (Browse Jobs) every 3 hours on GitHub's servers,
# so the live site gets fresh positions and drops closed ones — no PC needed.
# Run it by hand any time: GitHub → Actions → "Refresh jobs" → Run workflow.
name: Refresh jobs

on:
  schedule:
    - cron: '17 */3 * * *'   # every 3 hours, at :17 past (UTC) — avoids the busy top of the hour
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-jobs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch jobs, mark closed ones
        run: node scripts/refresh-jobs.js

      - name: Save changes
        run: |
          if git diff --quiet -- feed/jobs.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name  "jobs-refresh-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/jobs.json
          git commit -m "Refresh jobs $(date -u +'%Y-%m-%d %H:%M') UTC"
          # Someone may have pushed meanwhile — rebase and retry a few times
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1
