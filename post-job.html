<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Post a Job — TechTalent Portal</title>
<style>
:root{--blue:#0b2e59;--accent:#1565c0;--green:#1b8a4a;--light:#e8f0fe;--text:#1a1a1a;--muted:#555;--border:#c5d5e8;--bg:#f7f9fc;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;}
.topnav{background:var(--blue);display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:56px;position:sticky;top:0;z-index:200;}
.topnav .logo{color:#fff;font-size:1.2rem;font-weight:700;text-decoration:none;}
.topnav .logo span{color:#7ec8f7;}
.nav-links{display:flex;gap:4px;align-items:center;}
.nav-links a{color:rgba(255,255,255,.8);text-decoration:none;padding:6px 14px;border-radius:4px;font-size:.9rem;}
.nav-links a:hover,.nav-links a.active{background:rgba(255,255,255,.15);color:#fff;}
.page-header{background:linear-gradient(135deg,#0b2e59,#1565c0);color:#fff;padding:48px 20px;text-align:center;}
.page-header h1{font-size:2rem;font-weight:800;margin-bottom:8px;}
.page-header p{opacity:.85;max-width:520px;margin:0 auto;}
.wrap{max-width:720px;margin:32px auto;padding:0 20px 60px;}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:32px;}
.card h2{font-size:1.1rem;font-weight:700;color:var(--blue);margin-bottom:20px;border-left:4px solid var(--accent);padding-left:12px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:540px){.form-row{grid-template-columns:1fr;}}
.fg{margin-bottom:16px;}
.fg label{display:block;font-size:.85rem;font-weight:700;color:var(--blue);margin-bottom:5px;}
.fg input,.fg select,.fg textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:.93rem;font-family:inherit;background:var(--bg);}
.fg textarea{resize:vertical;min-height:100px;}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:2px solid var(--accent);border-color:transparent;}
.skills-wrap{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px;min-height:32px;}
.skill-chip{background:var(--light);color:var(--blue);padding:4px 11px;border-radius:20px;font-size:.82rem;font-weight:700;display:flex;align-items:center;gap:5px;}
.skill-chip button{background:none;border:none;cursor:pointer;color:var(--muted);font-size:1rem;line-height:1;padding:0;}
.skills-input-row{display:flex;gap:8px;margin-bottom:8px;}
.skills-input-row input{flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:.9rem;}
.skills-input-row button{padding:8px 16px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer;}
.btn-submit{width:100%;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;margin-top:8px;}
.btn-submit:hover{background:#0d47a1;}
.msg{border-radius:8px;padding:12px 16px;font-size:.9rem;margin-bottom:16px;display:none;}
.msg.success{background:#d4edda;color:#155724;}
.msg.error{background:#fdecea;color:#c62828;}
.login-gate{text-align:center;padding:48px 20px;}
.login-gate h2{color:var(--blue);margin-bottom:10px;}
.login-gate a{background:var(--accent);color:#fff;padding:12px 28px;border-radius:8px;text-decoration:none;font-weight:700;display:inline-block;margin-top:12px;}
</style>
<script src="site.js" defer></script>
</head>
<body>

<nav class="topnav" id="siteNav"></nav>
<script src="nav.js"></script>

<div class="page-header">
  <h1>📋 Post a Freelance Job</h1>
  <p>Reach hundreds of Salesforce &amp; IT freelancers. Your job will appear on the job board instantly.</p>
</div>

<div class="wrap">

  <!-- Login gate -->
  <div id="loginGate" class="login-gate" style="display:none">
    <div style="font-size:3rem;margin-bottom:10px">🔒</div>
    <h2>Sign in to post a job</h2>
    <p style="color:var(--muted)">You need an account so candidates can reach you and you can track applicants.</p>
    <a href="login.html?next=post-job.html">Sign In / Register →</a>
  </div>

  <!-- Form -->
  <div id="formWrap">
    <div class="card">
      <h2>Job Details</h2>
      <div id="msgBox" class="msg"></div>

      <div class="form-row">
        <div class="fg">
          <label>Job Title *</label>
          <input id="f-title" type="text" placeholder="e.g. Salesforce Developer">
        </div>
        <div class="fg">
          <label>Company / Your Name *</label>
          <input id="f-company" type="text" placeholder="Acme Corp or Jane Smith">
        </div>
      </div>

      <div class="form-row">
        <div class="fg">
          <label>Location</label>
          <input id="f-location" type="text" placeholder="Remote / City, Country" value="Remote">
        </div>
        <div class="fg">
          <label>Job Type</label>
          <select id="f-type">
            <option value="Freelance">Freelance / Contract</option>
            <option value="Part-time">Part-time</option>
            <option value="Full-time">Full-time</option>
            <option value="Internship">Internship</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="fg">
          <label>Budget / Salary</label>
          <input id="f-salary" type="text" placeholder="e.g. $50/hr or $3000/month">
        </div>
        <div class="fg">
          <label>Experience Required</label>
          <select id="f-exp">
            <option value="">Any level</option>
            <option value="0-1 years">0–1 years</option>
            <option value="1-3 years">1–3 years</option>
            <option value="3-5 years">3–5 years</option>
            <option value="5+ years">5+ years</option>
          </select>
        </div>
      </div>

      <div class="fg">
        <label>Required Skills</label>
        <div class="skills-input-row">
          <input id="skillInput" type="text" placeholder="Type a skill and press Add (e.g. Apex)">
          <button type="button" onclick="addSkill()">Add</button>
        </div>
        <div class="skills-wrap" id="skillsWrap"></div>
      </div>

      <div class="fg">
        <label>Job Description *</label>
        <textarea id="f-desc" rows="5" placeholder="Describe the role, responsibilities, and what you're looking for..."></textarea>
      </div>

      <div class="fg">
        <label>Contact Email (shown to applicants)</label>
        <input id="f-email" type="email" placeholder="your@email.com">
      </div>

      <div class="fg">
        <label>External Apply URL (optional)</label>
        <input id="f-applyurl" type="url" placeholder="https://... (leave blank to use in-portal applications)">
      </div>

      <button data-once class="btn-submit" id="submitBtn" onclick="submitJob()">📋 Post This Job</button>
    </div>
  </div>
</div>

<script>
const API = 'http://localhost:4747';
let user = null;
try { const s = sessionStorage.getItem('ttp_session') || localStorage.getItem('ttp_session'); user = s ? JSON.parse(s) : null; } catch {}
const skills = [];

// Gate
if (!user) {
  document.getElementById('loginGate').style.display = 'block';
  document.getElementById('formWrap').style.display = 'none';
} else {
  document.getElementById('f-email').value = user.email || '';
}

document.getElementById('skillInput').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addSkill(); } });

function addSkill() {
  const v = document.getElementById('skillInput').value.trim();
  if (!v || skills.includes(v)) { document.getElementById('skillInput').value=''; return; }
  skills.push(v);
  renderSkills();
  document.getElementById('skillInput').value = '';
}
function removeSkill(i) { skills.splice(i,1); renderSkills(); }
function renderSkills() {
  document.getElementById('skillsWrap').innerHTML = skills.map((s,i) =>
    `<span class="skill-chip">${s}<button onclick="removeSkill(${i})" title="Remove">×</button></span>`
  ).join('');
}

function showMsg(type, text) {
  const box = document.getElementById('msgBox');
  box.className = 'msg ' + type;
  box.textContent = text;
  box.style.display = 'block';
  box.scrollIntoView({ behavior:'smooth', block:'nearest' });
}

async function submitJob() {
  const title   = document.getElementById('f-title').value.trim();
  const company = document.getElementById('f-company').value.trim();
  const desc    = document.getElementById('f-desc').value.trim();
  if (!title || !company || !desc) { showMsg('error', 'Please fill in Job Title, Company, and Description.'); return; }
  const contactEmail = document.getElementById('f-email').value.trim();
  if (contactEmail && !ttpValidEmail(contactEmail)) { showMsg('error', 'Please enter a full contact email address, like hiring@company.com.'); document.getElementById('f-email').focus(); return; }

  const btn = document.getElementById('submitBtn');
  btn.textContent = 'Posting…'; btn.disabled = true;

  const payload = {
    title, company,
    location:    document.getElementById('f-location').value.trim() || 'Remote',
    type:        document.getElementById('f-type').value,
    salary:      document.getElementById('f-salary').value.trim(),
    experience:  document.getElementById('f-exp').value,
    skills,
    description: desc,
    email:       document.getElementById('f-email').value.trim(),
    applyUrl:    document.getElementById('f-applyurl').value.trim(),
    postedBy:    { name: user.name, email: user.email, userId: user.id },
    postedAt:    new Date().toISOString(),
    expiresAt:   new Date(Date.now() + 30*864e5).toISOString(),   // listing closes after 30 days
    status:      'open'
  };

  // Try server first, fall back to localStorage
  let savedOnServer = false;
  try {
    const r = await fetch(`${API}/jobs`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload), signal: AbortSignal.timeout(4000) });
    if (r.ok) { savedOnServer = true; }
  } catch {}

  if (!savedOnServer) {
    // Save to localStorage so it appears on the job board offline
    const local = JSON.parse(localStorage.getItem('ttp_local_jobs')||'[]');
    payload.id = 'local_' + Date.now().toString(36);
    payload.source = 'TechTalent Portal';
    local.unshift(payload);
    localStorage.setItem('ttp_local_jobs', JSON.stringify(local));
  }

  // Track in my-posted-jobs list
  const posted = JSON.parse(localStorage.getItem('ttp_my_jobs')||'[]');
  if (!payload.id) payload.id = 'portal_' + Date.now().toString(36);
  payload.source = 'TechTalent Portal';
  posted.unshift({ ...payload, applicantCount: 0 });
  localStorage.setItem('ttp_my_jobs', JSON.stringify(posted));

  showMsg('success', savedOnServer
    ? '✅ Job posted! It is now live on the job board. Go to My Dashboard → My Posted Jobs to track applicants.'
    : '✅ Job saved locally! (Server offline — it will sync when your server restarts.) Check My Dashboard.');

  try { if (window.ttpMail) ttpMail.add('inbox', { kind: 'job', subject: `Job posted: ${payload.title}`, body: `${payload.company} · ${payload.location || 'Remote'}\nIt closes automatically on ${new Date(payload.expiresAt).toLocaleDateString()}. You can mark it as filled any time in My Dashboard → My Posted Jobs.`, link: 'dashboard.html?tab=posted' }); } catch (e) {}
  btn.textContent = '✅ Posted!';
  setTimeout(() => { window.location.href = 'dashboard.html?tab=posted'; }, 2200);
}
</script>
</body>
</html>
